name: Playwright Test Automation CI

on:
  push:
    branches: [ main, master, dash ]
  pull_request:
    branches: [ main, master, dash ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Select Test Suite'
        required: true
        default: 'smoke'
        type: choice
        options:
          - 'smoke'
          - 'all'

jobs:
  test:
    name: Run Playwright Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create .env File from Secret
      if: env.HAS_SECRET != ''
      env:
        HAS_SECRET: ${{ secrets.ENV_FILE }}
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env

    - name: Run Playwright Tests
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'https://reqres.in' }}
        API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://reqres.in' }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      run: |
        if [ "${{ github.event.inputs.suite }}" = "all" ]; then
          echo "Executing Full Test Suite..."
          npm test
        else
          echo "Executing Smoke Suite (@smoke: Login + Create Lead)..."
          npm run test:smoke
        fi

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: reports/html-report/
        retention-days: 30

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: execution-logs
        path: logs/
        retention-days: 7

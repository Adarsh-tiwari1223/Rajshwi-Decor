name: Playwright Test Automation CI

on:
  push:
    branches: [ main, master, dash ]
  pull_request:
    branches: [ main, master, dash ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Select Test Suite'
        required: true
        default: 'smoke'
        type: choice
        options:
          - 'smoke'
          - 'all'

# Cancel outdated workflow runs if there are multiple pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create .env File from Secret
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
      run: |
        if [ -n "$ENV_FILE_CONTENT" ]; then
          echo "$ENV_FILE_CONTENT" > .env
          echo ".env file successfully created from ENV_FILE secret."
        else
          echo "Warning: ENV_FILE secret is empty. Using default staging environment configuration."
        fi

    - name: Run Playwright Tests
      env:
        BASE_URL: https://crm-stg.rajasvidecor.com
        API_BASE_URL: https://crm-stg-api.rajasvidecor.com
      run: |
        if [ "${{ github.event.inputs.suite }}" = "all" ]; then
          echo "Executing Full Test Suite..."
          npm test
        else
          echo "Executing Smoke Suite (@smoke: Login + Create Lead)..."
          npm run test:smoke
        fi

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: reports/html-report/
        retention-days: 30

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: execution-logs
        path: logs/
        retention-days: 7
